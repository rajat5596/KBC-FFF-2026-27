<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>प्रैक्टिस शुरू - FFF मास्टर</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
    /* Game-specific styles */
    .game-header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 10px;
        flex-wrap: wrap; 
        gap: 8px; 
    }
    #timer { 
        font-size: 2.5rem;
        color: #ffd700; 
        text-shadow: 0 0 15px #ffd700; 
        margin: 0; 
        padding: 8px 15px;
        background: rgba(0,0,0,0.3); 
        border-radius: 50px; 
        border: 2px solid #ffd700; 
    }
    #user-plan-display { 
        padding: 6px 15px; 
        border-radius: 25px; 
        font-weight: bold; 
        font-size: 0.9rem;
        border: 2px solid #ffd700; 
        box-shadow: 0 0 12px rgba(255,215,0,0.3); 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
        color: white; 
    }
    #question-text { 
        font-size: 1.1rem !important;
        margin: 15px 0 !important; 
        padding: 12px !important; 
        background: rgba(0,0,0,0.5); 
        border-radius: 12px; 
        border: 2px solid #00d4ff; 
        text-align: center; 
        line-height: 1.4 !important; 
    }
    #options-container { 
        display: grid; 
        grid-template-columns: repeat(2, 1fr); 
        gap: 8px !important;
        margin: 10px 0 !important; 
    }
    .option-btn { 
        background: linear-gradient(145deg, #2c3e50, #3498db); 
        color: white; 
        border: 2px solid #ffd700; 
        padding: 10px !important;
        font-size: 0.95rem !important;
        border-radius: 10px; 
        cursor: pointer; 
        transition: all 0.3s ease; 
        min-height: 60px !important;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        width: 100%; 
        text-align: center; 
    }
    .option-btn.selected { 
        background: gold !important; 
        color: black !important; 
    }
    .game-footer { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-top: 20px;
        gap: 10px; 
    }
    .lock-answer-btn { 
        background: linear-gradient(145deg, #ffd700, #ffa500); 
        color: black; 
        border: 2px solid #fff; 
        padding: 10px 30px !important;
        font-size: 1rem !important;
        font-weight: bold; 
        border-radius: 40px; 
        cursor: pointer; 
        box-shadow: 0 0 15px #ffd700; 
        width: 180px !important;
        display: block; 
        margin: 15px auto !important; 
    }
    #result { 
        font-size: 1.1rem;
        padding: 12px; 
        border-radius: 10px; 
        background: rgba(0,0,0,0.5); 
        text-align: center; 
        margin-top: 15px; 
    }
    .logout-btn { 
        background: #c0392b; 
        color: white; 
        border: none; 
        padding: 8px 12px; 
        border-radius: 8px; 
        font-weight: bold; 
    }
    .home-btn { 
        background: #2c3e50; 
        color: white; 
        border: 1px solid #ffd700; 
        padding: 8px 12px; 
        border-radius: 8px; 
        font-weight: bold; 
    }
    
    @media (max-width: 480px) { 
        #options-container { grid-template-columns: 1fr; }
        #question-text { font-size: 1rem !important; }
        .option-btn { font-size: 0.9rem !important; min-height: 55px !important; }
    }

    body {
        margin: 0;
        padding: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    .main-container {
        padding: 10px;
        max-width: 100%;
        box-sizing: border-box;
    }
</style>
</head>
<body>
    <div class="main-container">

        <!-- Top Ad Unit -->
        <div id="top-ad" style="margin: 10px auto; text-align: center; min-height: 50px; max-width: 320px;">
            <script type="text/javascript">
                atOptions = { 'key' : '8bb7bd31447ffb74a3ebec1be09202fe', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/8bb7bd31447ffb74a3ebec1be09202fe/invoke.js"></script>
        </div>

        <div class="game-header">
            <div id="timer">20</div>
            <div id="user-plan-display">लोड हो रहा है...</div>
        </div>
        <div id="question-text">सवाल लोड हो रहा है...</div>
        <div id="options-container"></div>
        
        <!-- FIXED: onclick function name changed to lockAnswer() -->
        <div style="text-align: center;">
            <button id="lock-answer-btn" class="lock-answer-btn">🔒 उत्तर लॉक करें</button>
        </div>

        <div id="result"></div>

        <!-- Bottom Ad Unit -->
        <div id="bottom-ad" style="margin: 20px auto; text-align: center; min-height: 50px; max-width: 320px;">
            <script type="text/javascript">
                atOptions = { 'key' : '8bb7bd31447ffb74a3ebec1be09202fe', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/8bb7bd31447ffb74a3ebec1be09202fe/invoke.js"></script>
        </div>

        <div class="game-footer">
            <button onclick="window.location.href='index.html'" class="home-btn">🏠 होम</button>
            <button onclick="logout()" class="logout-btn">🚪 लॉगआउट</button>
        </div>
    </div>

    <script>
        function logout() {
            localStorage.clear();
            if (typeof firebase !== 'undefined') {
                firebase.auth().signOut().then(() => {
                    window.location.replace("index.html");
                }).catch(() => {
                    window.location.replace("index.html");
                });
            } else {
                window.location.replace("index.html");
            }
        }
    </script>

    <!-- REMOVED: question.js - aapke game.js mein already free questions embedded hain -->
    <script src="game.js"></script>
</body>
</html>
