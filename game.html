    <style>
    /* Game-specific styles */
    .game-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
    }
    
    #timer {
        font-size: 3rem;
        color: #ffd700;
        text-shadow: 0 0 20px #ffd700;
        margin: 0;
        padding: 10px 20px;
        background: rgba(0,0,0,0.3);
        border-radius: 50px;
        border: 2px solid #ffd700;
    }
    
    #user-plan-display {
        padding: 8px 20px;
        border-radius: 30px;
        font-weight: bold;
        font-size: 1rem;
        border: 2px solid #ffd700;
        box-shadow: 0 0 15px rgba(255,215,0,0.3);
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    
    #question-text {
        font-size: 1.5rem;
        margin: 30px 0;
        padding: 20px;
        background: rgba(0,0,0,0.5);
        border-radius: 15px;
        border: 2px solid #00d4ff;
        text-align: center;
        line-height: 1.5;
    }
    
    /* Options Container - ORIGINAL */
    #options-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        margin: 20px 0;
    }
    
    /* Option Buttons - ORIGINAL */
    .option-btn {
        background: linear-gradient(145deg, #2c3e50, #3498db);
        color: white;
        border: 2px solid #ffd700;
        padding: 15px;
        font-size: 1.2rem;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        min-height: 80px;
        word-break: break-word;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        text-align: center;
    }
    
    .option-btn:hover {
        transform: scale(1.02);
        box-shadow: 0 0 15px #ffd700;
    }
    
    .option-btn.selected {
        background: gold;
        color: black;
        border-color: #fff;
    }
    
    .game-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 30px;
        gap: 15px;
    }
    
    #result {
        font-size: 1.3rem;
        padding: 15px;
        border-radius: 10px;
        background: rgba(0,0,0,0.5);
        text-align: center;
        margin-top: 20px;
    }
    
    .logout-btn {
        background: linear-gradient(145deg, #c0392b, #e74c3c);
        border: 2px solid #fff;
        padding: 12px 20px;
        width: auto;
        margin: 0;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }
    
    .home-btn {
        background: linear-gradient(145deg, #2c3e50, #34495e);
        border: 2px solid #ffd700;
        padding: 12px 20px;
        width: auto;
        margin: 0;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }
    
    /* Lock Button Style - NEW */
    .lock-btn {
        background: linear-gradient(145deg, #ffd700, #ffa500);
        color: black;
        border: 2px solid #fff;
        padding: 15px 40px;
        font-size: 1.3rem;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 20px #ffd700;
        width: auto;
        min-width: 200px;
        margin: 20px auto;
        display: block;
    }
    
    .lock-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px #ffd700;
        background: linear-gradient(145deg, #ffa500, #ffd700);
    }
    
    .lock-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }
    
    @media (max-width: 480px) {
        #options-container {
            grid-template-columns: 1fr;
        }
        
        .game-header {
            flex-direction: column;
        }
        
        #timer {
            font-size: 2.5rem;
        }
        
        #question-text {
            font-size: 1.2rem;
        }
        
        .lock-btn {
            min-width: 150px;
            padding: 12px 20px;
            font-size: 1.1rem;
        }
    }
</style>
</head>
<body>
    <div class="main-container">
        <!-- Game Header with Timer and Plan Display -->
        <div class="game-header">

        <!-- Question Display -->
        <div id="question-text">सवाल लोड हो रहा है...</div>
        
        <!-- Options Container (buttons will be added by game.js) -->

        <!-- Game Footer with Action Buttons -->
        <div class="game-footer">

            <button onclick="logout()" class="logout-btn">🚪 लॉगआउट</button>
        </div>
        
        <!-- Result Display -->
        <div id="result"></div>
    </div>

        // Logout Function
        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            
            firebase.auth().signOut().then(() => {
                console.log("✅ Logged out from game");
                window.location.replace("index.html");
            }).catch((error) => {
                console.error("❌ Logout Error:", error);
                window.location.reload();
            });
        }
        
        // Check if user is logged in
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                console.log("⚠️ No user logged in, redirecting to index");
                window.location.replace("index.html");
            }
        });

<div class="game-footer">
