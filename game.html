<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>प्रैक्टिस शुरू - FFF मास्टर</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
    /* Game-specific styles */
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    #timer { font-size: 3rem; color: #ffd700; text-shadow: 0 0 20px #ffd700; margin: 0; padding: 10px 20px; background: rgba(0,0,0,0.3); border-radius: 50px; border: 2px solid #ffd700; }
    #user-plan-display { padding: 8px 20px; border-radius: 30px; font-weight: bold; font-size: 1rem; border: 2px solid #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.3); background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    #question-text { font-size: 1.5rem; margin: 30px 0; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 15px; border: 2px solid #00d4ff; text-align: center; line-height: 1.5; }
    #options-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
    .option-btn { background: linear-gradient(145deg, #2c3e50, #3498db); color: white; border: 2px solid #ffd700; padding: 15px; font-size: 1.2rem; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; min-height: 80px; display: flex; align-items: center; justify-content: center; width: 100%; text-align: center; }
    .option-btn.selected { background: gold !important; color: black !important; }
    .game-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; gap: 15px; }
    .lock-answer-btn { background: linear-gradient(145deg, #ffd700, #ffa500); color: black; border: 2px solid #fff; padding: 15px 40px; font-size: 1.3rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px #ffd700; width: 220px; display: block; margin: 20px auto; }
    #result { font-size: 1.3rem; padding: 15px; border-radius: 10px; background: rgba(0,0,0,0.5); text-align: center; margin-top: 20px; }
    .logout-btn { background: #c0392b; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
    .home-btn { background: #2c3e50; color: white; border: 1px solid #ffd700; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
    
    @media (max-width: 480px) { #options-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="game-header">
            <div id="timer">20</div>
            <div id="user-plan-display">लोड हो रहा है...</div>
        </div>
        
        <div id="question-text">सवाल लोड हो रहा है...</div>
        <div id="options-container"></div>
        
        <div style="text-align: center;">
            <button id="lock-answer-btn" onclick="checkSequence()" class="lock-answer-btn">🔒 उत्तर लॉक करें</button>
        </div>

        <div id="result"></div>

        <div class="game-footer">
            <button onclick="window.location.href='index.html'" class="home-btn">🏠 होम</button>
            <button onclick="logout()" class="logout-btn">🚪 लॉगआउट</button>
        </div>
    </div>

    <script>
        // यहाँ से Firebase Initialize हटा दिया गया है क्योंकि वह game.js में पहले से है
        function logout() {
            localStorage.clear();
            firebase.auth().signOut().then(() => {
                window.location.replace("index.html");
            });
        }
    </script>

    <script src="question.js"></script>
<script src="game.js"></script>
</body>
</html>
