        <div id="login-section">
            <input type="text" id="username" placeholder="अपना नाम लिखें" required>
            <input type="number" id="mobile" placeholder="मोबाइल नंबर" required>

    <button onclick="logout()" style="background:red; color:white; padding:5px 10px; border-radius:5px; border:none; margin-bottom:15px; cursor:pointer;">Logout (लॉगआउट)</button>

    <button onclick="window.location.href='game.html'" class="menu-btn">प्रैक्टिस शुरू करें</button>
    
    <hr style="border: 0.5px solid #ffd700; opacity: 0.5; margin: 20px 0;">
    <h3 style="color: #ffd700; margin-bottom: 10px;">प्लान अपग्रेड करें</h3>
    <div class="plans">
        <button class="plan-btn" onclick="buySilver()">सिल्वर (₹49) - 500 सवाल</button>
        <button class="plan-btn" onclick="buyGold()">गोल्ड (₹99) - 1500 सवाल</button>
        <button class="plan-btn" onclick="buyPlatinum()">प्लैटिनम (₹199) - अनलिमिटेड</button>
