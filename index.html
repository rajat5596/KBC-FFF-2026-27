<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KBC FFF मास्टर - Rajat Classes</title>
    
    <meta name="theme-color" content="#1a2a6c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json?v=1.0">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        #user-plan-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            margin: 15px 0;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 2px solid #ffd700;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 5px #ffd700; }
            to { box-shadow: 0 0 20px #ffd700; }
        }
        
        .plan-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-left: 10px;
        }
        
        .silver-badge { background: #C0C0C0; color: #000; }
        .gold-badge { background: #FFD700; color: #000; }
        .platinum-badge { background: #E5E4E2; color: #000; border: 1px solid #fff; }
        .free-badge { background: #4CAF50; color: white; }
        .expired-badge { background: #f44336; color: white; }
        
        #welcome-msg {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div id="top-ad" style="margin-bottom: 10px; text-align: center; min-height: 50px;">
            <script type="text/javascript">
                atOptions = { 'key' : '8bb7bd31447ffb74a3ebec1be09202fe', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/8bb7bd31447ffb74a3ebec1be09202fe/invoke.js"></script>
        </div>

        <h1 class="logo">KBC 2026</h1>
        <h2 class="title">Fastest Finger First मास्टर</h2>
        
        <div id="login-section">
            <input type="text" id="username" placeholder="अपना नाम लिखें" required>
            <input type="number" id="mobile" placeholder="मोबाइल नंबर" required>
            <div id="recaptcha-container"></div>
            <button id="auth-btn" onclick="sendOTP()" class="start-btn">OTP भेजें</button>
        </div>

        <div id="menu-section" style="display: none;">
            <p id="welcome-msg"></p>
            
            <!-- यहाँ प्लान दिखेगा -->
            <div id="user-plan-display"></div>
            
            <button onclick="logout()" class="logout-btn" style="background:red; color:white; width:100%; padding:12px; border-radius:8px; border:none; margin-bottom:15px; font-weight:bold;">Logout (लॉगआउट)</button>

            <button onclick="window.location.href='game.html'" class="menu-btn" style="width:100%; margin-bottom:20px;">प्रैक्टिस शुरू करें</button>
            
            <hr style="border: 0.5px solid #ffd700; opacity: 0.5; margin: 20px 0;">
            <h3 style="color: #ffd700; margin-bottom: 10px;">प्लान अपग्रेड करें</h3>
            <div class="plans">
                <button class="plan-btn" onclick="buyPlan('silver')">सिल्वर (₹49) - 500 सवाल</button>
                <button class="plan-btn" onclick="buyPlan('gold')">गोल्ड (₹99) - 1500 सवाल</button>
                <button class="plan-btn" onclick="buyPlan('platinum')">प्लैटिनम (₹199) - अनलिमिटेड</button>
            </div>
        </div>

        <div id="bottom-ad" style="margin-top: 20px; text-align: center; min-height: 50px;">
            <script type="text/javascript">
                atOptions = { 'key' : '8bb7bd31447ffb74a3ebec1be09202fe', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/8bb7bd31447ffb74a3ebec1be09202fe/invoke.js"></script>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://pl28712423.effectivegatecpm.com/e8/d4/74/e8d4747620e17e5817130756fb7c22ff.js"></script>
</body>
</html>
